<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dhanush Medicals logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a38f"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#013728"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- Bow (Dhanush) -->
  <path d="M33 9 C12 17 12 47 33 55" fill="none" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Bow string = vertical bar of the medical cross -->
  <rect x="29.5" y="12" width="7" height="40" rx="3.5" fill="#fff"/>
  <!-- Arrow shaft = horizontal bar of the medical cross -->
  <rect x="17" y="28.5" width="33" height="7" rx="3.5" fill="#fff"/>
  <!-- Arrow head -->
  <path d="M47 21.5 L58.5 32 L47 42.5 Z" fill="url(#gold)"/>
</svg>
