<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7f0e4"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#34d3b5" stop-opacity=".55"/><stop offset="1" stop-color="#34d3b5" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="220" cy="150" r="140" fill="url(#glow)"/>
<circle cx="220" cy="150" r="110" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
<circle cx="220" cy="150" r="140" stroke="#fff" stroke-opacity=".1" stroke-width="2" stroke-dasharray="4 10"/>
<!-- bottle -->
<g transform="translate(150 60)">
<rect x="10" y="0" width="80" height="34" rx="9" fill="url(#gold)"/>
<rect x="0" y="30" width="100" height="170" rx="20" fill="#fff" fill-opacity=".96"/>
<rect x="14" y="70" width="72" height="84" rx="10" fill="#047857"/>
<rect x="43" y="84" width="14" height="46" rx="4" fill="#fff"/><rect x="27" y="100" width="46" height="14" rx="4" fill="#fff"/>
<rect x="24" y="138" width="52" height="5" rx="2.5" fill="#fff" fill-opacity=".6"/>
<rect x="10" y="42" width="8" height="140" rx="4" fill="#d1fae5" fill-opacity=".8"/>
</g>
<!-- capsule 1 -->
<g transform="translate(300 70) rotate(35)"><rect width="104" height="40" rx="20" fill="url(#cap)"/><path d="M52 0h32a20 20 0 0 1 0 40H52z" fill="url(#gold)"/><rect x="10" y="8" width="40" height="6" rx="3" fill="#fff" fill-opacity=".8"/></g>
<!-- capsule 2 -->
<g transform="translate(60 190) rotate(-30)"><rect width="96" height="36" rx="18" fill="url(#cap)"/><path d="M48 0h30a18 18 0 0 1 0 36H48z" fill="#047857"/><rect x="9" y="7" width="34" height="5" rx="2.5" fill="#fff" fill-opacity=".8"/></g>
<!-- round pills -->
<circle cx="338" cy="214" r="26" fill="#fff"/><path d="M312 214h52" stroke="#c7f0e4" stroke-width="4"/>
<circle cx="86" cy="96" r="20" fill="url(#gold)"/><path d="M66 96h40" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
<!-- sparkles -->
<path d="M372 138l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff" fill-opacity=".85"/>
<path d="M120 40l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff" fill-opacity=".7"/>
</svg>
